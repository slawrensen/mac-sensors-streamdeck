# Keeps the SHA-pinned actions current by PR, so pins stay a reviewed diff
# instead of rotting. Actions PRs bump the pinned commit and its version
# comment together. npm is left out on purpose: runtime dependencies are pinned
# to the shared core by core-sync.json and `npm run core:check` rejects a bump
# that does not come through `npm run core:sync`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
