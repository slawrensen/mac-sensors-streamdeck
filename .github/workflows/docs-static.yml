name: docs-static
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-static.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/docs-static.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: docs
          destination: build/docs-static
      - name: Check the static publication boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('build/docs-static')
          pages = {'index','installation','getting-started','sensor-reading','sensor-details','sensor-dial','dial-controls','themes','thresholds','data-sources','status-screens','hardware','faq','troubleshooting','changelog'}
          files = [p for p in root.rglob('*') if p.is_file()]
          for p in root.rglob('*'):
              if p.is_symlink(): raise SystemExit('Symlink in static export')
          for p in files:
              name = p.relative_to(root).as_posix()
              allowed = name in {page + '.html' for page in pages} or re.fullmatch(r'assets/(?:css|js|img|images)/(?:vendor/)?[A-Za-z0-9_.-]+\.(?:css|js|json|png|jpg|jpeg|webp|svg)', name)
              if not allowed: raise SystemExit('Unexpected exported file: ' + name)
              if p.suffix in {'.html','.css','.js','.json','.svg'}:
                  text = p.read_text()
                  if re.search(r'/Users/|C:\\Users\\|-----BEGIN [A-Z ]*PRIVATE KEY-----|\bgh[pousr]_[A-Za-z0-9]{20,}|RELEASE_RUNBOOK|COPY_RULES|STREAM_DECK_MARKETPLACE|\.private\b', text):
                      raise SystemExit('Private material in static export: ' + name)
          if {p.stem for p in root.glob('*.html')} != pages: raise SystemExit('Documentation page inventory differs')
          print('Validated', len(files), 'static documentation files; no product source or release package.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-sensors-docs-static
          path: build/docs-static/
          retention-days: 14
          if-no-files-found: error
