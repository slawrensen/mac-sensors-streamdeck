name: ci
on:
  push:
    branches: [main, assembly]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.1
          cache: npm
      - name: Read pinned core revision
        id: core
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+JSON.parse(fs.readFileSync('core-sync.json')).upstream.commit+'\n')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: slawrensen/hwinfo-streamdeck
          ref: ${{ steps.core.outputs.sha }}
          path: upstream
          persist-credentials: false
      # The qualification core stage runs core:check without --release; this
      # step fails CI on an open port review instead of only the tag build.
      - name: Check copied core for release
        env:
          MACSENSORS_UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: npm run core:check -- --release
      - run: npm ci --ignore-scripts
      - name: Software qualification
        env:
          MACSENSORS_UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: npm run release:validate -- --out release/ci-qualification
      - run: npm run build:test
      - run: npm run suite:full
      - name: Retain exact native bytes for the ABI matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.arch }}
          path: build/native/production/
          retention-days: 14
          if-no-files-found: error
      - name: Retain package and qualification record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pack-qualification-${{ matrix.arch }}
          path: release/
          retention-days: 14
  abi:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        target:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.target.arch }}
          path: native-artifact
      - name: Load and read the exact artifact without rebuilding
        run: node scripts/abi-check.mjs native-artifact
