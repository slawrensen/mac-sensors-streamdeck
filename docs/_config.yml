title: Mac Sensors for Stream Deck
description: Read-only Mac sensor readings on Stream Deck keys and dials.
# Served at https://docs.slawrensen.com/mac-streamdeck/ beneath the umbrella
# site's custom domain. This folder carries no CNAME.
url: https://docs.slawrensen.com
baseurl: /mac-streamdeck
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
color_scheme: dark
search_enabled: true
heading_anchors: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 12
  rel_url: false
  focus_shortcut_key: k
enable_copy_code_button: true

plugin_release:
  version: 1.0.2
  package_version: 1.0.2.0
  tag: v1.0.2
  download: https://github.com/slawrensen/mac-sensors-streamdeck/releases/download/v1.0.2/com.lawrensen.mac.streamDeckPlugin
  notes: https://github.com/slawrensen/mac-sensors-streamdeck/releases/tag/v1.0.2
  marketplace: https://marketplace.elgato.com/product/mac-sensors-f04e345c-21c5-411c-9ecd-01864c3a8c3c
  marketplace_version: 1.0.1.0
  checked: 2026-11-09
bug_reports: https://github.com/slawrensen/mac-sensors-streamdeck/issues

# Repo link in the header and "Edit this page" in the footer.
gh_edit_link: true
gh_edit_repository: https://github.com/slawrensen/mac-sensors-streamdeck
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

# Link previews use the production-rendered overview board.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/readme-hero.png
        alt: "Board of Mac Sensors keys and dials: one temperature key in each of the seven themes, a four-reading key, single keys for temperature, fan, power, CPU, memory, network and free space, two- and three-reading keys, a ring and a bar, warning and critical keys, a Back tile, a detail title tile and four dial views"

# Internal release runbooks: kept next to the docs, never published.
exclude:
  - release/
footer_content: Free and MIT licensed. No ads or telemetry. &copy; Stephen Lawrensen.
footer_trademarks: >-
  Not affiliated with Apple or Elgato. Mac and macOS are trademarks of Apple Inc.
  Stream Deck is a trademark of Corsair Memory, Inc.
