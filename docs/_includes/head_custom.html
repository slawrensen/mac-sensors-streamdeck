<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101215">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/brand/mac-sensors-icon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/brand/mac-sensors-icon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/brand/mac-sensors-icon-180.png' | relative_url }}">
{% if page.url == '/404.html' %}<meta name="robots" content="noindex">{% endif %}
<script>document.documentElement.classList.add('docs-js');</script>
{% include docs_identity.html %}
{% if docs_build_id %}<meta name="docs-build-id" content="{{ docs_build_id }}"><meta name="docs-source-sha" content="{{ docs_source_sha }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}{% if docs_build_id %}?v={{ docs_build_id | url_encode }}{% endif %}">
<script src="{{ '/assets/js/docs.js' | relative_url }}{% if docs_build_id %}?v={{ docs_build_id | url_encode }}{% endif %}" defer></script>
