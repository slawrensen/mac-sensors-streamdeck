{% include docs_identity.html %}
<footer class="docs-footer">
	<div class="footer-links"><a href="{{ '/troubleshooting.html' | relative_url }}">Troubleshooting</a><a href="{{ '/faq.html#privacy' | relative_url }}">Privacy</a><a href="{{ site.gh_edit_repository }}/blob/main/SECURITY.md">Security & verification</a><a href="{{ site.bug_reports }}">Report a bug</a><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
	<p{% if page.url == '/' %} id="license-and-trademarks"{% endif %}>{{ site.footer_content }}</p>
	<p>{{ site.footer_trademarks }}</p>
	<p class="footer-meta">Built with <a href="https://github.com/just-the-docs/just-the-docs">Just the Docs</a>.{% if site.gh_edit_link %} <a id="edit-this-page" href="{{ site.gh_edit_repository }}/{{ site.gh_edit_view_mode }}/{{ site.gh_edit_branch }}/{{ site.gh_edit_source }}/{{ page.path }}">Edit this page</a>.{% endif %}{% if docs_build_id %} <span data-build-id="{{ docs_build_id }}">Build {{ docs_build_id }}</span>.{% endif %}</p>
</footer>
